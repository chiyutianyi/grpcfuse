name: CI

on:
  push:
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [ "1.17.x", "1.21.x", "1.22.x" ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
        cache: true

    - name: Install dependencies
      run: sudo apt-get install -qq fuse3 libssl-dev libfuse-dev

    - name: Build
      run: go build ./...

    - name: Build example
      run: make example

    - name: Test
      run: go test -cover -v ./...

  race:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22.x"
        cache: true

    - name: Install dependencies
      run: sudo apt-get install -qq fuse3 libssl-dev libfuse-dev

    - name: Test (race detector)
      run: go test -race -v ./...
