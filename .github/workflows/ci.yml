name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.17'
  GOOS: linux
  GOARCH: amd64

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.17, 1.18, 1.19, 1.20]
        platform: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy

    - name: Run linter
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

    - name: Run tests
      run: |
        make test
        make coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage_*.out
        flags: unittests
        name: codecov-umbrella

    - name: Run benchmarks
      run: make benchmark

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy

    - name: Run integration tests
      run: |
        go test -v ./integration/...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run security scan
      uses: actions/gosupervisor/security-action@v1
      with:
        args: --severity HIGH,CRITICAL

    - name: Run gosec
      run: |
        go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
        gosec -fmt=json -out=results.json ./...
        gosec -fmt=text ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, integration, security]
    strategy:
      matrix:
        platform: [linux, darwin, windows]
        arch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy

    - name: Build examples
      run: |
        GOOS=${{ matrix.platform }} GOARCH=${{ matrix.arch }} make example

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: grpcfuse-${{ matrix.platform }}-${{ matrix.arch }}
        path: bin/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, integration, security]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t grpcfuse:latest .

    - name: Test Docker image
      run: |
        docker run --rm grpcfuse:latest make test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, integration, security, build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build release binaries
      run: |
        make clean
        GOOS=linux GOARCH=amd64 make example
        GOOS=linux GOARCH=arm64 make example
        GOOS=darwin GOARCH=amd64 make example
        GOOS=darwin GOARCH=arm64 make example
        GOOS=windows GOARCH=amd64 make example

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated release from CI pipeline
          
          ## Changes
          - Automated build and test
          - Multi-platform support
          - Security scanning
          
          ## Binaries
          - Linux (amd64, arm64)
          - macOS (amd64, arm64)
          - Windows (amd64)
        draft: false
        prerelease: false

    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./bin/
        asset_name: grpcfuse-binaries
        asset_content_type: application/octet-stream
